<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="wrap">

    </div>
    <script>
        const wrap = document.querySelector('.wrap');

        const mediaQuery = window.matchMedia('(max-width: 600px)');

        function hendleChange(e){
            if(e.matches){
                wrap.innerHTML = `<p>Hello Mobile</p>`;
            }
            else{
                wrap.innerHTML = `<p>Hello Dekstop</p>`;
            }
        }
        hendleChange(mediaQuery);
        mediaQuery.addEventListener('change',hendleChange);
    </script>
</body>
</html>
