<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile-First Navigation</title>
    <style>
        /* --- General Reset & Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        /* --- 1. GAYA DASAR FOR MOBILE (DEFAULT) --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            padding: 15px 20px;
            color: white;
            position: relative;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Tombol Hamburger (Muncul secara default di mobile) */
        .hamburger {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            background: none;
            border: none;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background-color: white;
            margin: 4px 0;
            transition: 0.3s;
        }

        /* Menu Link di Mobile (Tersembunyi secara default) */
        .nav-links {
            display: none; 
            flex-direction: column;
            width: 100%;
            background-color: #333;
            position: absolute;
            top: 100%; 
            left: 0;
            padding: 10px 0;
            list-style: none;
        }

        .nav-links li {
            text-align: center;
            margin: 15px 0;
        }

        .nav-links li a {
            color: white;
            text-decoration: none;
            padding: 10px;
            display: block;
            transition: color 0.3s;
        }

        /* Class utility yang di-toggle oleh JS untuk membuka menu */
        .nav-links.active {
            display: flex; 
        }


        /* --- 2. GAYA UNTUK LAYAR BESAR / DESKTOP (min-width) --- */
        /* Gaya di dalam sini hanya berjalan jika lebar layar minimal 768px */
        @media (min-width: 768px) {
            .hamburger {
                display: none; /* Sembunyikan hamburger di desktop */
            }

            .nav-links {
                display: flex; /* Tampilkan menu link secara permanen */
                flex-direction: row; /* Ubah arah menu menjadi horizontal */
                position: static; /* Kembalikan ke posisi normal navbar */
                width: auto;
                padding: 0;
            }

            .nav-links li {
                margin: 0; /* Hapus margin vertikal mobile */
            }

            .nav-links li a {
                padding: 0 15px;
            }

            .nav-links li a:hover {
                color: #00bcd4;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">MyWebsite</div>
        
        <!-- Hamburger Menu Button -->
        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Navigation Links -->
        <ul class="nav-links" id="nav-links-container">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- JavaScript (Tetap sama & sederhana) -->
    <script>
        const hamburger = document.getElementById('hamburger-btn');
        const navLinks = document.getElementById('nav-links-container');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>

</body>
</html>
