<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Type HTML</title>
</head>
<body>
    <script>
        // ======= Number =======
        let x = 100;
        document.writeln(100);
        document.write("<br/>")
        document.writeln(typeof x); // This is number data type
        
        
        // ========== BOOLEAN =========
        document.write("<br/>")
        const haveGirlFriend = true;
        const haveMarried = false;
        
        document.writeln(typeof haveGirlFriend);
        document.writeln(typeof haveMarried);
        //This is Boolean Data type
        
        // ===== STRING ======
        document.write("<br/>")
        const name = "Boby";
        const country = "Alaska";

        document.writeln(typeof name);
        document.writeln(typeof country)
    </script>
</body>
</html>
