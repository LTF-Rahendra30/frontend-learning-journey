<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean data type</title>
</head>
<body>
    <script>
        const haveGirlFriend = true;
        const haveMarried = false;

        document.writeln(typeof haveGirlFriend);
        document.writeln(typeof haveMarried);

        // This is Boolean Data type
    </script>
</body>
</html>
