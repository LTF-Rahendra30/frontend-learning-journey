<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Form Validator with HTML Output</h1>

    <article class="form-container">
        <h2>Login</h2>
        <form action="">
            <div class="form-item">
                <label for="">Nama:</label>
                <input type="text">
            </div>

            <div class="form-item">
                <label for="">Email:</label>
                <input type="email">
            </div>

            <div class="form-item">
                <label for="">Password:</label>
                <input type="password">
            </div>
        </form>
    </article>
    <script src="script.js"></script>
</body>
</html>
