<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            font-family: sans-serif;
            background-color: #fefbf6;
        }
        /* --- Header Form --- */
        header{
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(108, 107, 107, 0.459);
        }

        .container{
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        form{
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background-color: #fceee2;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
        }
        .form-item{
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label{
            font-weight: 700;
        }
        input{
            padding: 8px;
            border-radius: 8px;
            outline: none;
            border: 1.4px solid rgb(251, 196, 169);
            background-color: #fef7f7;
        }
        input:focus{
            border: 1.4px solid rgb(254, 122, 85);
        }
        button{
            cursor: pointer;
            color: #fff;
            border-radius: 16px;
            padding: 8px;
            font-weight: bold;
            border: none;
            background-color: rgb(253, 143, 75);
        }
        button:hover{
            background-color: rgb(253, 122, 75);
        }

        /* ============== POPUP OUTPUT =========== */
        .result-container{
            display: none;
        }
        
        .popup-active .result-container{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            
            position: absolute;
            width: 400px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 14px;
            top: 50%;
            left: 50%;
            z-index: 99;
            transform: translate(-50%, -50%);
        }

        .result-content{
            font-weight: bold;
            border-radius: 10px;
            max-width: 150px;
            padding: 12px;
            text-align: center;
        }
        .result-content-valid{
            background-color: #95f4ba;
        }
        .result-content-invalid{
            background-color: #f49595;
        }

        /* Result Atribute */
        .row-atribute{
            padding: 20px;
            border-radius: 14px;
            background-color: #eae9e8;
        }

        .x-button{
            display: none;
        }
        
        .popup-active .x-button{
            padding: 6px 10px;
            position: fixed;
            right: 10px;
            top: 10px;
            z-index: 999;
            background-color: #f23c3c;
            display: block;
        }
        .x-button:hover{
            background-color: #ee0202;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="" id="form-container">
            <header class="head-form">
                <h2>Legals Age Validator</h2>
            </header>

            <div class="form-item">
                <label for="name-input" id="name">Name:</label>
                <input type="text" name="name-input" id="name-input" placeholder="Plase enter your name.....">
            </div>
            
            <div class="form-item">
                <label for="age-input" id="age">Age:</label>
                <input type="number" name="age-input" id="age-input" placeholder="Plase enter your age..." min="1" max="100">
            </div>

            <button type="submit">Send</button>
        </form>
    </div>

        <!-- result -->
    <article id="result-container">
        <button class="x-button" id="x-button">&times;</button>
        <p id="name-row"> <span id="name-value"></span></p>

        <p id="age-row"> <span id="age-value"></span></p>
        <p id="result-text"></p>
    </article>

    <script src="script.js"></script>
</body>
</html>
