<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
</head>
<body>
    <h2>Grade Calculator</h2>
    <form action="" id="form-container">
        <div class="form-item">
            <label for="name-input">Name:</label>
            <input type="text" name="name-input" id="name-input" placeholder="Plase enter your name.....">
        </div>
            
        <div class="form-item">
            <label for="grade-input">Your Grade:</label>
            <input type="number" name="grade-input" id="grade-input" placeholder="Enter your grade..." max="100" min="1">
        </div>

        <button type="submit">Send</button>
    </form>
</body>
</html>
