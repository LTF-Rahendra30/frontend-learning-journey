
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Methods Playground</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product {
            padding: 12px 16px;
            background: #eeeeee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Product List</h1>

        <div id="product-list" class="product-list">
            <div class="product">Basic Tee</div>
            <div id="hoodie" class="product">Hoodie</div>
            <div class="product">Pants</div>
        </div>

    </main>
    <!-- 
    Laptop
    Basic Tee
    T-Shirt
    Hoodie
    Jacket
    Pants
    Running Shoes -->
    <script>
        const productList = document.getElementById('product-list');
        // prepand
        const newProduct1 = document.createElement('div');
        newProduct1.classList.add('product');
        newProduct1.textContent = 'Laptop';
        productList.prepend(newProduct1);
        
        const hoodie = document.getElementById('hoodie');
        const newProduct2 = document.createElement('div');
        newProduct2.classList.add('product');
        newProduct2.textContent = 'T-Shirt';
        hoodie.before(newProduct2);
        
        // After
        const newProduct3 = document.createElement('div');
        newProduct3.classList.add('product');
        newProduct3.textContent = 'Jacket';
        hoodie.after(newProduct3);

        // Append
        const appendlast = document.createElement('div');
        appendlast.classList.add('product');
        appendlast.textContent = 'Running Shoes';
        productList.append(appendlast);
    </script>

</body>
</html>
