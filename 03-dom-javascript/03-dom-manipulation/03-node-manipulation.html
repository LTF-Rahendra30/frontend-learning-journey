
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Methods Playground</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product {
            padding: 12px 16px;
            background: #eeeeee;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Product List</h1>

        <div id="product-list" class="product-list">
            <div class="product">Basic Tee</div>
            <div id="hoodie" class="product">Hoodie</div>
            <div class="product">Pants</div>
        </div>

    </main>
<!-- 
                     Product List

                 Laptop
                 Basic Tee
                 T-Shirt
                 Hoodie
                 Jacket
                 Pants
                 Running Shoes -->
    <script>
        const productList = document.getElementById('product-list');

        // prepand
        const newProduct1 = document.createElement('div');
        newProduct1.setAttribute('class','product');
        newProduct1.textContent = 'Laptop - new 1';
        productList.prepend(newProduct1);
        
        // before
        const hoodie = document.getElementById('hoodie');
        const newProduct2 = document.createElement('div');
        newProduct2.setAttribute('class','product');
        newProduct2.textContent = 'T-Shirt - new 2';
        hoodie.before(newProduct2);
        
        // After
        const newProduct3 = document.createElement('div');
        newProduct3.setAttribute('class','product');
        newProduct3.textContent = 'Jacket - new 3';
        hoodie.after(newProduct3);
        
        // Append
        const appendlast = document.createElement('div');
        appendlast.setAttribute('class','product');
        appendlast.textContent = 'Running Shoes - new 4';
        productList.append(appendlast);

        </script>

</body>
</html>
