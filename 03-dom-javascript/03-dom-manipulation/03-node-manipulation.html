
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Methods Playground</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .product-list {
            display: flex;
            flex-direction: column;

            padding: 12px 16px;
            background: #eeeeee;
            border-radius: 8px;
        }

<body>

    <main class="container">

        <h1>Product List</h1>

        <div class="product-list">
            <div class="product">Basic Tee</div>

    <script src="script3.js"></script>

</html>
